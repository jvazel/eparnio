<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#1D7DFA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Fond dégradé -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Enveloppe blanche -->
  <g filter="url(#shadow)">
    <rect x="96" y="156" width="320" height="220" rx="36" fill="#FFFFFF" />
    <path
      d="M114 176L256 278L398 176"
      stroke="#CBD5E1"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Badge vert émeraude avec coche -->
  <g filter="url(#shadow)">
    <circle cx="384" cy="156" r="54" fill="#22C55E" stroke="#FFFFFF" stroke-width="10" />
    <path
      d="M360 156L376 172L408 140"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
